name: Pre-release

on:
  push:
    tags:
      # Pre-release tags only, e.g. v0.1.0-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  DOCKER_BUILDX_VERSION: 'v0.23.0'
  GHCR_REGISTRY: ghcr.io/web-seven

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-pre-release-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-pre-release-

      - name: Cache Go Dependencies
        uses: actions/cache@v5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Build Artifacts
        run: make -j2 build.all
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_ARGS: "--load"

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io
        # BRANCH_NAME must match xpkg.mk's RELEASE_BRANCH_FILTER or publish.artifacts is a silent no-op.
        run: make publish BRANCH_NAME=main XPKG_REG_ORGS=${GHCR_REGISTRY} XPKG_REG_ORGS_NO_PROMOTE=${GHCR_REGISTRY}
        env:
          VERSION: ${{ github.ref_name }}
