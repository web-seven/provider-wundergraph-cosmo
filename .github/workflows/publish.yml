name: Publish Provider Package

on:
  push:
    tags:
      # Release tags only; pre-release tags are handled by pre-release.yml.
      - 'v*'
      - '!v*-*'

env:
  DOCKER_BUILDX_VERSION: 'v0.23.0'
  GHCR_REGISTRY: ghcr.io/web-seven
  UPBOUND_REGISTRY: xpkg.upbound.io/web7

  # Copy secrets to env so we can test for their presence without
  # 'secrets.XXX != ""' (which is not allowed in 'if' expressions).
  XPKG_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}

jobs:
  publish-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve release version
        id: version
        run: echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.version }}
          submodules: true

      - name: Fetch History
        run: git fetch --prune --unshallow

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Find the Go Build Cache
        id: go
        run: echo "cachedir=$(make go.cachedir)" >> $GITHUB_ENV

      - name: Cache the Go Build Cache
        uses: actions/cache@v5
        with:
          path: ${{ env.cachedir }}
          key: ${{ runner.os }}-build-release-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-release-

      - name: Cache Go Dependencies
        uses: actions/cache@v5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Download Go Modules
        run: make modules.download modules.check

      - name: Build Artifacts
        run: make -j2 build.all
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_ARGS: "--load"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            _output/bin/*/provider
            _output/xpkg/**/*.xpkg
          if-no-files-found: error

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to ghcr.io
        # BRANCH_NAME must match xpkg.mk's RELEASE_BRANCH_FILTER or publish.artifacts is a silent no-op.
        run: make publish BRANCH_NAME=main XPKG_REG_ORGS=${GHCR_REGISTRY} XPKG_REG_ORGS_NO_PROMOTE=${GHCR_REGISTRY}
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Login to Upbound Marketplace
        if: env.XPKG_ACCESS_ID != ''
        uses: docker/login-action@v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Publish to Upbound Marketplace
        if: env.XPKG_ACCESS_ID != ''
        run: make publish BRANCH_NAME=main XPKG_REG_ORGS=${UPBOUND_REGISTRY} XPKG_REG_ORGS_NO_PROMOTE=${UPBOUND_REGISTRY}
        env:
          VERSION: ${{ steps.version.outputs.version }}

  append-marketplace-extensions:
    needs: publish-release
    runs-on: ubuntu-22.04
    if: ${{ needs.publish-release.result == 'success' }}
    env:
      XPKG_ACCESS_ID: ${{ secrets.XPKG_ACCESS_ID }}

    steps:
      - name: Checkout
        if: env.XPKG_ACCESS_ID != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish-release.outputs.version }}
          submodules: true

      - name: Install up CLI
        if: env.XPKG_ACCESS_ID != ''
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://cli.upbound.io | UP_CHANNEL=stable sh
          mv up "$HOME/.local/bin/up"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Login to Upbound Marketplace
        if: env.XPKG_ACCESS_ID != ''
        uses: docker/login-action@v3
        with:
          registry: xpkg.upbound.io
          username: ${{ secrets.XPKG_ACCESS_ID }}
          password: ${{ secrets.XPKG_TOKEN }}

      - name: Append marketplace extensions
        if: env.XPKG_ACCESS_ID != ''
        run: make publish.extensions
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}

  github-release:
    needs: publish-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.publish-release.outputs.version }}
          path: _output

      - name: Package Release Assets
        env:
          VERSION: ${{ needs.publish-release.outputs.version }}
        run: |
          mkdir -p dist
          for bin in _output/bin/*/provider; do
            platform=$(basename "$(dirname "$bin")")
            chmod +x "$bin"
            tar -czf "dist/provider-wundergraph-cosmo_${VERSION}_${platform}.tar.gz" -C "$(dirname "$bin")" provider
          done
          for pkg in _output/xpkg/*/*.xpkg; do
            platform=$(basename "$(dirname "$pkg")")
            cp "$pkg" "dist/provider-wundergraph-cosmo_${VERSION}_${platform}.xpkg"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-release.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi
